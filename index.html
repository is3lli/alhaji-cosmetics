<style>
/* ============ Design Tokens ============ */
:root{
  --olive:#7A8864; --olive-deep:#5E6A4F; --olive-soft:#8A977A;
  --dusty:#A9BDD1; --stone:#C8C0B5; --champagne:#E5D5BC; --bisque:#E5BCA9; --ivory:#FAF7F2;
  --ease-out:cubic-bezier(.22,1,.36,1);
}
html[data-theme="light"]{
  --bg:#FAF7F2; --bg-grad-a:rgba(169,189,209,.5); --bg-grad-b:rgba(229,188,169,.42); --bg-grad-c:rgba(229,213,188,.5);
  --surface:rgba(255,255,255,.62); --surface-2:rgba(255,255,255,.9);
  --border:rgba(163,148,127,.28); --border-hover:rgba(185,150,115,.5);
  --text:#322E27; --text-2:rgba(50,46,39,.6);
  --name-g1:#63584A; --name-g2:#B08968; --name-g3:#64798F;
  --card-shadow:0 12px 32px -14px rgba(140,120,95,.32);
  --card-shadow-hover:0 22px 44px -16px rgba(140,120,95,.42);
  --glow:rgba(229,188,169,.4); --pill-active-bg:#A9BDD1; --pill-active-fg:#2F3527;
  --shine:rgba(255,255,255,.55); --sparkle-op:.55;
}
html[data-theme="dark"]{
  --bg:#171412; --bg-grad-a:rgba(169,189,209,.13); --bg-grad-b:rgba(229,188,169,.12); --bg-grad-c:rgba(229,213,188,.12);
  --surface:rgba(250,247,242,.055); --surface-2:rgba(250,247,242,.1);
  --border:rgba(250,247,242,.11); --border-hover:rgba(229,213,188,.38);
  --text:#F1EDE3; --text-2:rgba(241,237,227,.58);
  --name-g1:#E5D5BC; --name-g2:#E5BCA9; --name-g3:#A9BDD1;
  --card-shadow:0 16px 36px -16px rgba(0,0,0,.65);
  --card-shadow-hover:0 24px 48px -18px rgba(0,0,0,.75);
  --glow:rgba(229,213,188,.18); --pill-active-bg:#E5D5BC; --pill-active-fg:#2F3527;
  --shine:rgba(250,247,242,.13); --sparkle-op:.4;
}
/* ============ Base ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Cairo','Noto Sans Arabic',system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--text); min-height:100svh;
  display:flex; flex-direction:column; align-items:center;
  overflow-x:hidden;
  transition:background-color .5s ease,color .5s ease;
  animation:pageIn .8s var(--ease-out) both;
}
@keyframes pageIn{from{opacity:0}to{opacity:1}}
::selection{background:rgba(169,189,209,.5)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
svg{display:block}
/* ============ Ambient Scene ============ */
.scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(80px);will-change:transform;transition:opacity .6s ease}
.blob-a{width:64vmax;height:64vmax;top:-24vmax;inset-inline-start:-20vmax;background:var(--bg-grad-a);animation:driftA 26s ease-in-out infinite alternate}
.blob-b{width:58vmax;height:58vmax;bottom:-22vmax;inset-inline-end:-18vmax;background:var(--bg-grad-b);animation:driftB 31s ease-in-out infinite alternate}
.blob-c{width:44vmax;height:44vmax;top:36%;inset-inline-start:32%;background:var(--bg-grad-c);animation:driftC 38s ease-in-out infinite alternate}
@keyframes driftA{from{transform:translate(0,0) scale(1)}to{transform:translate(9vmax,7vmax) scale(1.15)}}
@keyframes driftB{from{transform:translate(0,0) scale(1.1)}to{transform:translate(-8vmax,-6vmax) scale(.95)}}
@keyframes driftC{from{transform:translate(-4vmax,0) scale(.9)}to{transform:translate(5vmax,-5vmax) scale(1.12)}}
.sparkles{position:absolute;inset:0}
.spark{position:absolute;color:var(--champagne);opacity:0;animation:twinkle var(--sdur,7s) ease-in-out var(--sdel,0s) infinite}
@keyframes twinkle{
  0%,100%{opacity:0;transform:translateY(0) scale(.5) rotate(0deg)}
  50%{opacity:var(--sparkle-op);transform:translateY(-26px) scale(1) rotate(180deg)}
}
/* ============ Topbar ============ */
.topbar{
  position:fixed;top:0;inset-inline:0;z-index:20;
  display:flex;justify-content:space-between;align-items:center;
  padding:calc(14px + env(safe-area-inset-top)) clamp(14px,4vw,22px) 0;
}
.lang-pill{
  display:flex;gap:2px;padding:4px;border-radius:999px;
  background:var(--surface);border:1px solid var(--border);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 6px 18px -10px rgba(120,105,85,.28);
  transition:background-color .5s ease,border-color .5s ease;
}
.lang-btn{
  min-height:36px;padding:4px 13px;border-radius:999px;
  font-size:.82rem;font-weight:700;letter-spacing:.02em;color:var(--text-2);
  transition:color .3s ease,background-color .35s ease,transform .2s var(--ease-out);
}
.lang-btn:active{transform:scale(.93)}
.lang-btn.active{background:var(--pill-active-bg);color:var(--pill-active-fg);box-shadow:0 4px 12px -4px rgba(120,105,85,.5)}
.theme-btn{
  width:44px;height:44px;border-radius:50%;position:relative;
  background:var(--surface);border:1px solid var(--border);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 6px 18px -10px rgba(120,105,85,.28);
  transition:background-color .5s ease,border-color .5s ease,transform .3s var(--ease-out);
}
.theme-btn:active{transform:scale(.9) rotate(-14deg)}
.theme-btn svg{position:absolute;inset:0;margin:auto;width:20px;height:20px;transition:opacity .45s ease,transform .55s var(--ease-out)}
.ic-moon{opacity:0;transform:rotate(-90deg) scale(.4);color:var(--champagne)}
.ic-sun{opacity:1;transform:rotate(0) scale(1);color:#C98A4B}
html[data-theme="dark"] .ic-moon{opacity:1;transform:rotate(0) scale(1)}
html[data-theme="dark"] .ic-sun{opacity:0;transform:rotate(90deg) scale(.4)}
/* ============ Layout ============ */
.wrap{
  position:relative;z-index:1;width:100%;max-width:520px;
  padding:calc(92px + env(safe-area-inset-top)) 22px 26px;
  display:flex;flex-direction:column;align-items:center;
  transition:opacity .24s ease,transform .24s ease;
}
.wrap.switching{opacity:0;transform:translateY(10px)}
/* ============ Profile ============ */
.profile{display:flex;flex-direction:column;align-items:center;text-align:center}
.avatar{position:relative;width:128px;height:128px;margin-bottom:20px;animation:floatY 6.5s ease-in-out infinite alternate}
@keyframes floatY{from{transform:translateY(0)}to{transform:translateY(-7px)}}
.avatar-ring{
  position:absolute;inset:-5px;border-radius:50%;
  background:conic-gradient(from 0deg,var(--champagne),var(--dusty),var(--bisque),var(--stone),var(--champagne));
  animation:ringspin 9s linear infinite;
}
@keyframes ringspin{to{transform:rotate(360deg)}}
.avatar-core{position:absolute;inset:0;border-radius:50%;background:var(--bg);display:grid;place-items:center;transition:background-color .5s ease}
.avatar-img{
  width:112px;height:112px;border-radius:50%;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(160deg,#C4E9FC 0%,#8FD6F9 100%);
  box-shadow:0 10px 28px -8px var(--glow),inset 0 2px 8px rgba(255,255,255,.2);
}
.avatar-img img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar-glow{position:absolute;inset:-16px;border-radius:50%;background:radial-gradient(circle,var(--glow) 0%,transparent 65%);z-index:-1;animation:pulseGlow 4s ease-in-out infinite}
@keyframes pulseGlow{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
.name{
  font-size:clamp(1.75rem,7.5vw,2.3rem);font-weight:900;line-height:1.25;letter-spacing:-.01em;
  background:linear-gradient(90deg,var(--name-g1),var(--name-g2),var(--name-g3),var(--name-g2),var(--name-g1));
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:sheen 7s ease-in-out infinite;
}
@keyframes sheen{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.tagline{
  font-family:'Cinzel','Cairo',serif;font-size:clamp(.72rem,2.9vw,.86rem);font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--text-2);margin-top:9px;
}
.handle{font-size:.85rem;font-weight:600;color:var(--text-2);opacity:.75;margin-top:5px;letter-spacing:.03em;direction:ltr}
.bio{font-size:clamp(.95rem,3.8vw,1.08rem);font-weight:700;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;
  font-size:.8rem;font-weight:700;color:var(--text);
  background:var(--surface);border:1px solid var(--border);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:transform .3s var(--ease-out),background-color .5s ease,border-color .5s ease;
}
@media(hover:hover){.chip:hover{transform:translateY(-3px)}}
.chip svg{width:13px;height:13px;color:#B08A64;flex:none}
html[data-theme="dark"] .chip svg{color:var(--champagne)}
/* ============ CTA ============ */
.cta{
  display:flex;align-items:center;gap:8px;margin:26px 0 16px;
  font-size:1rem;font-weight:800;color:var(--text);
}
/* ============ Link Cards ============ */
.links{width:100%;display:grid;gap:14px}
.card{
  position:relative;overflow:hidden;
  display:flex;align-items:center;gap:14px;
  padding:15px 17px;border-radius:22px;
  background:var(--surface);border:1px solid var(--border);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:var(--card-shadow);
  transition:transform .38s var(--ease-out),box-shadow .38s ease,border-color .38s ease,background-color .5s ease;
}
@media(hover:hover){
  .card:hover{transform:translateY(-4px);border-color:var(--border-hover);box-shadow:var(--card-shadow-hover)}
  .card:hover .card-ic{transform:scale(1.1) rotate(-5deg)}
  .card:hover .card-go{transform:translate(3px,-3px);color:#A0785A}
  html[data-theme="dark"] .card:hover .card-go{color:var(--champagne)}
}
.card:active{transform:scale(.975)}
.card::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 32%,var(--shine) 50%,transparent 68%);
  transform:translateX(-140%);transition:transform .9s ease;
}
.card:hover::after{transform:translateX(140%)}
.card-ic{
  width:48px;height:48px;flex:none;border-radius:15px;display:grid;place-items:center;color:#fff;
  box-shadow:0 8px 18px -6px rgba(47,53,39,.35),inset 0 1px 2px rgba(255,255,255,.32);
  transition:transform .4s var(--ease-out);
}
.card-ic svg{width:23px;height:23px}
.ic-instagram{background:linear-gradient(135deg,#E5BCA9 0%,#CE8E6E 55%,#B9746B 100%)}
.ic-whatsapp{background:linear-gradient(135deg,#9CAB89 0%,#6E7D5F 100%)}
.ic-telegram{background:linear-gradient(135deg,#B4C6D8 0%,#7E96AD 100%)}
.ic-phone{background:linear-gradient(135deg,#C8B59A 0%,#97866C 100%)}
.card-tx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.card-t{font-size:.98rem;font-weight:800;line-height:1.4}
.card-s{font-size:.8rem;font-weight:600;color:var(--text-2);line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-go{width:20px;height:20px;flex:none;color:var(--text-2);opacity:.65;transition:transform .35s var(--ease-out),color .3s ease}
.num{direction:ltr;unicode-bidi:isolate;align-self:flex-start;max-width:100%}
/* ============ Footer ============ */
.foot{
  position:relative;z-index:1;margin-top:auto;
  padding:30px 20px calc(20px + env(safe-area-inset-bottom));
  text-align:center;
}
.sig{font-size:.78rem;font-weight:600;color:var(--text-2);letter-spacing:.04em}
.sig a{
  color:#7C8FA6;font-weight:800;border-bottom:1px dashed rgba(124,143,166,.5);
  padding-bottom:1px;transition:color .3s ease,border-color .3s ease;
}
html[data-theme="dark"] .sig a{color:var(--champagne)}
.sig a:hover{border-bottom-style:solid}
/* ============ Entrance Reveals ============ */
.reveal{opacity:0;animation:fadeUp .85s var(--ease-out) var(--d,0s) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
/* ============ Reduced Motion ============ */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  .reveal{opacity:1}
  .spark{display:none}
}
</style>
</head>

<script>
(function(){
"use strict";
/* ================= i18n ================= */
var I18N = {
  ar: {
    _dir:"rtl", _lang:"ar", _title:"كوزمتك الحجي | Beauty • Cosmetics",
    name:"كوزمتك الحجي",
    tagline:"ALHAJI | Beauty • Cosmetics ✨",
    bio:"أكثر من 15 سنة ثقة وخبرة 💎",
    chip1:"أصلي 100%", chip2:"بأنسب الأسعار", chip3:"يوصلك لباب بيتك 🚚",
    cta:"للتواصل والحجز",
    in_t:"إنستغرام", in_s:"تابعنا على إنستغرام",
    wa_t:"واتساب",   wa_s:"راسلنا واتساب",
    ph_t:"للاتصال",
    tg_t:"تيليجرام", tg_s:"تابع قناتنا على تيليجرام",
    _nav:"روابطنا"
  },
  ku: {
    _dir:"rtl", _lang:"ckb", _title:"کۆسمەتیک الحجي | Beauty • Cosmetics",
    name:"کۆسمەتیک الحجي",
    tagline:"ALHAJI | جوانی • کۆسمەتیک ✨",
    bio:"زیاتر لە ١٥ ساڵ متمانە و ئەزموون 💎",
    chip1:"ڕەسەن ١٠٠٪", chip2:"بە هەرزانترین نرخ", chip3:"دەگاتە دەرگای ماڵەکەت 🚚",
    cta:"بۆ پەیوەندی و حجز",
    in_t:"ئینستاگرام", in_s:"بەدوامان بکەوە لە ئینستاگرام",
    wa_t:"واتساپ",    wa_s:"پەیوەندیمان پێوە بکە لە واتساپ",
    ph_t:"بۆ پەیوەندی",
    tg_t:"تێلێگرام",  tg_s:"سەردانی کەناڵەکەمان بکە",
    _nav:"بەستەرەکەمان"
  },
  en: {
    _dir:"ltr", _lang:"en", _title:"ALHAJI Cosmetics | Beauty • Cosmetics",
    name:"ALHAJI Cosmetics",
    tagline:"ALHAJI | Beauty • Cosmetics ✨",
    bio:"Over 15 years of trust & experience 💎",
    chip1:"100% Authentic", chip2:"Best Prices", chip3:"Delivered to Your Door 🚚",
    cta:"Contact & Booking",
    in_t:"Instagram", in_s:"Follow us on Instagram",
    wa_t:"WhatsApp",  wa_s:"Chat with us anytime",
    ph_t:"Call Now",
    tg_t:"Telegram",  tg_s:"Join our channel",
    _nav:"Our links"
  }
};
/* ================= Helpers ================= */
var $  = function(s){ return document.querySelector(s); };
var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };
function store(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function read(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
/* ================= Theme ================= */
var themeBtn = $("#themeBtn");
var metaTheme = $("#metaTheme");
var THEME_META = { light:"#FAF7F2", dark:"#171412" };
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  if(metaTheme) metaTheme.setAttribute("content", THEME_META[t] || "#FAF7F2");
  themeBtn.setAttribute("aria-label", t === "dark" ? "Light mode" : "Dark mode");
}
function initTheme(){
  var saved = read("alhaji_theme");
  var sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(saved || (sysDark ? "dark" : "light"));
}
themeBtn.addEventListener("click", function(){
  var cur = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(cur); store("alhaji_theme", cur);
});
/* ================= Language ================= */
var wrap = $("#main");
function applyLang(code){
  var d = I18N[code]; if(!d) return;
  var html = document.documentElement;
  html.setAttribute("dir", d._dir);
  html.setAttribute("lang", d._lang);
  document.title = d._title;
  $$("[data-i18n]").forEach(function(el){
    var k = el.getAttribute("data-i18n");
    if(d[k] != null) el.textContent = d[k];
  });
  var nav = $(".links");
  if(nav) nav.setAttribute("aria-label", d._nav);
  $$(".lang-btn").forEach(function(b){
    b.classList.toggle("active", b.getAttribute("data-lang") === code);
  });
}
function setLang(code, animate){
  if(!I18N[code]) return;
  store("alhaji_lang", code);
  if(!animate){ applyLang(code); return; }
  wrap.classList.add("switching");
  setTimeout(function(){
    applyLang(code);
    wrap.classList.remove("switching");
  }, 240);
}
$$(".lang-btn").forEach(function(b){
  b.addEventListener("click", function(){
    var l = b.getAttribute("data-lang");
    if(!b.classList.contains("active")) setLang(l, true);
  });
});
function initLang(){
  var saved = read("alhaji_lang");
  applyLang(I18N[saved] ? saved : "ar");
}
/* ================= Sparkles ================= */
function initSparkles(){
  var box = $("#sparkles"); if(!box) return;
  var colors = ["#E5D5BC","#E5BCA9","#A9BDD1","#C8C0B5"];
  var n = window.innerWidth < 480 ? 10 : 16;
  for(var i=0;i<n;i++){
    var s = document.createElement("span");
    s.className = "spark";
    var size = 6 + Math.random()*9;
    s.textContent = "✦";
    s.style.left = (Math.random()*96) + "%";
    s.style.top  = (Math.random()*96) + "%";
    s.style.fontSize = size + "px";
    s.style.color = colors[i % colors.length];
    s.style.setProperty("--sdur", (5 + Math.random()*6).toFixed(2) + "s");
    s.style.setProperty("--sdel", (Math.random()*7).toFixed(2) + "s");
    s.style.opacity = "0";
    box.appendChild(s);
  }
}
/* ================= Init ================= */
initTheme();
initLang();
initSparkles();
})();
</script>
